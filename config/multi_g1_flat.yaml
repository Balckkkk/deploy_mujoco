      ambient: [0.25, 0.25, 0.25]
      diffuse: [0.75, 0.75, 0.75]
      specular: [0.25, 0.25, 0.25]
    lights:
      - name: key_light
        position: [2.5, -4.0, 6.0]
        direction: [-0.35, 0.45, -1.0]
        ambient: [0.12, 0.12, 0.12]
        diffuse: [0.85, 0.82, 0.78]
        specular: [0.25, 0.25, 0.25]
        cast_shadow: true
      - name: fill_light
        position: [-4.0, 4.0, 5.0]
        direction: [0.45, -0.35, -1.0]
        ambient: [0.08, 0.08, 0.10]
        diffuse: [0.45, 0.50, 0.60]
        specular: [0.10, 0.10, 0.12]
        cast_shadow: false
base_body: pelvis
anchor_body_index: 0
start_frame: 0
loop_motion: true
realtime: true

num_actions: 29
action_clip: [-10.0, 10.0]
observation_terms:
  command: 58
  motion_anchor_ori_b: 6
  base_ang_vel: 3
  joint_pos: 29
  joint_vel: 29
