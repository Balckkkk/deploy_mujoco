resume: true
num_steps_per_env: 24
max_iterations: 50000
save_interval: 100
experiment_name: r2_flat
empirical_normalization: false
device: cuda:0
run_name: ''
logger: tensorboard
wandb_project: r2_flat
load_run: 2026-06-04_21-31-12
load_checkpoint: model_5700.pt
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
algorithm:
  class_name: PPO
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  entropy_coef: 0.005
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  desired_kl: 0.01
  max_grad_norm: 1.0
