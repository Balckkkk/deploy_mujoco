# MuJoCo sim2sim configuration for the MultiModalWBC multi_g1_flat policy.
model_path: assets/g1/mjcf/g1_29dof_ame.xml
policy_path: policy/multi_g1_flat_2026-09-16_13-41-11/policy.onnx
motion_dir: /home/ubuntu/code/MultiModalWBC/datasets/extended_datasets/lafan1_dataset/g1/train
output_dir: sim2sim_output/multi_g1_flat

simulation_duration: 120.0
simulation_dt: 0.005
control_decimation: 4
terrain: flat
terrain_difficulty: 0.5
terrain_seed: 42
scene:
